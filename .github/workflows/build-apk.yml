# Builds an installable Android APK in the cloud. No Android Studio needed.
# How to run: GitHub repo > Actions > "Build Android APK" > Run workflow. Download the APK from "Artifacts".
name: Build Android APK

on:
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          corepack enable
          yarn install

      - name: Build web app for Android
        run: yarn build:android

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add camera permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' "$MANIFEST"

      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tiles-hub-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
